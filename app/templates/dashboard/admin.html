{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">Dashboard administrador</h1>
  <a class="btn btn-primary" href="/usuarios">Gestionar usuarios</a>
</div>
<div class="card">
  <div class="card-body">
    <h2 class="h5">Usuarios y roles</h2>
    <div class="table-responsive">
      <table class="table table-sm">
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Activo</th></tr></thead>
        <tbody>
          {% for user in users %}
            <tr>
              <td>{{ user.apellido }}, {{ user.nombre }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.rol }}</td>
              <td>{{ "Si" if user.activo else "No" }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
