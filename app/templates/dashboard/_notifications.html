<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between">
      <h2 class="h5">Notificaciones</h2>
      <a href="/notificaciones">Ver todas</a>
    </div>
    <ul class="list-group list-group-flush">
      {% for notification in notifications %}
        <li class="list-group-item px-0 {% if not notification.leida %}fw-semibold{% endif %}">
          {{ notification.mensaje }}
        </li>
      {% else %}
        <li class="list-group-item px-0">Sin notificaciones.</li>
      {% endfor %}
    </ul>
  </div>
</div>
