{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Nueva solicitud</h1>
<div class="card">
  <div class="card-body">
    <form method="post" action="/solicitudes" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Materia del banco</label>
        <select class="form-select" name="banco_materia_id" id="banco_materia_id">
          <option value="">No seleccionar materia del banco</option>
          {% for materia in materias_banco %}
            <option
              value="{{ materia.id }}"
              data-nombre="{{ materia.nombre }}"
              data-descripcion="{{ materia.descripcion }}"
            >
              {{ materia.nombre }} - {{ materia.carrera }} - {{ materia.universidad }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Tipo</label>
          <select class="form-select" name="tipo" id="tipo" required>
            {% for tipo in tipos %}
              <option value="{{ tipo }}">{{ tipo }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Titulo</label>
        <input class="form-control" name="titulo" id="titulo" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripcion</label>
        <textarea class="form-control" name="descripcion" id="descripcion" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Documentacion adjunta</label>
        <input class="form-control" type="file" name="files" multiple>
      </div>
      <button class="btn btn-primary" type="submit">Enviar solicitud</button>
      <a class="btn btn-link" href="/solicitudes">Cancelar</a>
    </form>
  </div>
</div>
<script>
  const materiaSelect = document.getElementById("banco_materia_id");
  const tipoSelect = document.getElementById("tipo");
  const tituloInput = document.getElementById("titulo");
  const descripcionInput = document.getElementById("descripcion");

  materiaSelect.addEventListener("change", () => {
    const option = materiaSelect.selectedOptions[0];
    if (!option || !option.value) {
      return;
    }
    tipoSelect.value = "Materia";
    tituloInput.value = option.dataset.nombre || "";
    descripcionInput.value = option.dataset.descripcion || "";
  });
</script>
{% endblock %}
