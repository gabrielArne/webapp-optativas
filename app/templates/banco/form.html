{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Nueva materia en banco</h1>
<div class="card">
  <div class="card-body">
    <form method="post" action="/banco">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input class="form-control" name="nombre" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripcion</label>
        <textarea class="form-control" name="descripcion" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Carrera</label>
        <input class="form-control" name="carrera" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Universidad</label>
        <input class="form-control" name="universidad" required>
      </div>
      <button class="btn btn-primary" type="submit">Guardar materia</button>
      <a class="btn btn-link" href="/banco">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
