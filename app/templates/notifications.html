{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Notificaciones</h1>
<div class="card">
  <div class="card-body">
    <div class="list-group">
      {% for notification in notifications %}
        <div class="list-group-item">
          <p class="mb-1">{{ notification.mensaje }}</p>
          <span class="small text-muted">{{ notification.fecha.strftime("%Y-%m-%d %H:%M") }}</span>
        </div>
      {% else %}
        <div class="list-group-item text-muted">No hay notificaciones.</div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
